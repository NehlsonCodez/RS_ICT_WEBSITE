services:
  - type: web
    name: rs-ict-website
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
    disk:
      name: rs-ict-data
      mountPath: /data
      sizeGB: 1
